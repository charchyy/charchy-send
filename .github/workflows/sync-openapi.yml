# Keeps openapi/openapi.yaml — the contract the types are generated from — in
# step with the one Charchy Send publishes at
# https://charchy.krd/docs/openapi.yaml. Daily, and on demand: when the
# published file differs, it regenerates the types and opens a pull request.
#
# Skips (and passes) while the published file isn't there, or isn't an
# OpenAPI document. A pull request opened with GITHUB_TOKEN does not start CI
# by itself: close and reopen it (or push to it) to run the checks.
#
# Opening the pull request needs "Allow GitHub Actions to create and approve
# pull requests" (organization and repository Settings → Actions → General).
# Without it the branch `sync/openapi` is still pushed, and the run ends with a
# notice linking to it. Every action is pinned to a full commit SHA.
name: Sync OpenAPI contract

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-openapi
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Compare with charchy.krd/docs/openapi.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the published contract
        id: download
        run: |
          status="$(curl -sS -L --max-time 30 -o "$RUNNER_TEMP/openapi.yaml" -w '%{http_code}' https://charchy.krd/docs/openapi.yaml || echo 000)"
          if [ "$status" != "200" ]; then
            echo "::notice::https://charchy.krd/docs/openapi.yaml answered ${status}; nothing to sync yet."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qE '^openapi: 3\.' "$RUNNER_TEMP/openapi.yaml"; then
            echo "::warning::The published file is not an OpenAPI document; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if cmp -s "$RUNNER_TEMP/openapi.yaml" openapi/openapi.yaml; then
            echo "::notice::openapi/openapi.yaml is up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cp "$RUNNER_TEMP/openapi.yaml" openapi/openapi.yaml
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.download.outputs.changed == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.download.outputs.changed == 'true'
        with:
          node-version: 24

      - name: Regenerate the types and check
        id: check
        if: steps.download.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm run generate
          if pnpm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1; then
            echo "result=Typecheck (source, tests, README) passes with the new contract." >> "$GITHUB_OUTPUT"
          else
            echo "result=Typecheck FAILS with the new contract: src/types.ts needs the new fields (see test/contract.types.ts)." >> "$GITHUB_OUTPUT"
          fi
          tail -40 "$RUNNER_TEMP/typecheck.log"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        if: steps.download.outputs.changed == 'true'
        continue-on-error: true # the organization may not let Actions open pull requests
        with:
          branch: sync/openapi
          delete-branch: true
          add-paths: |
            openapi/openapi.yaml
            src/generated/openapi.ts
          commit-message: "Sync openapi.yaml from charchy.krd/docs/openapi.yaml and regenerate types"
          title: "Sync the OpenAPI contract from charchy.krd"
          body: |
            The contract published at https://charchy.krd/docs/openapi.yaml changed. This copies it to `openapi/openapi.yaml` and regenerates `src/generated/openapi.ts`.

            ${{ steps.check.outputs.result }}

            Before merging: update the hand-shaped types in `src/types.ts` (and `CHANGELOG.md`) for any new field, and close and reopen this pull request to run CI.

      - name: Say where the change is
        if: steps.download.outputs.changed == 'true'
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "::notice::Opened ${PR_URL}"
          else
            echo "::warning::The contract changed but no pull request could be opened (Actions may not create pull requests here). If the branch sync/openapi was pushed, open one from https://github.com/${GITHUB_REPOSITORY}/compare/main...sync/openapi"
          fi
