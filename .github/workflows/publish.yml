# Publishes @charchy/send to npm when a tag `v<version>` is pushed — e.g.
# `v0.1.1` for version 0.1.1. Steps and the settings this relies on:
# RELEASING.md.
#
# Two jobs, so the credential exists only where nothing is built:
#   build    contents: read only. Checks the tagged commit is on main and the
#            tag matches package.json, runs every check without a cache,
#            packs the tarball and uploads it as an artifact.
#   publish  id-token: write, behind the `npm` environment. Downloads that
#            tarball and runs `npm stage publish --provenance` — no checkout,
#            no install, no project code.
#
# Staged publishing: CI can only STAGE a version. Nothing reaches the registry
# until a maintainer approves it on npmjs.com (Staged Packages tab) or with
# `npm stage approve <id>`, with 2FA — so a leaked CI credential or a hijacked
# workflow cannot ship a version on its own. The Trusted Publisher leaves
# "Allow npm publish" unticked.
#
# npm Trusted Publishing (OIDC): no NPM_TOKEN secret. Staging needs npm
# 11.15.0+ and Node 22.14+, and a GitHub-hosted runner; provenance needs this
# repository to be public.
#
# Every action is pinned to a full commit SHA (its release in the comment).
name: Publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Check, build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every branch, so the tagged commit can be checked against main
          persist-credentials: false

      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Tag a commit that has been merged into main."
            exit 1
          fi

      - name: The tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No cache: a release build restores nothing another run wrote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - name: Generated types match openapi/openapi.yaml
        run: pnpm run generate:check
      - name: Typecheck (source, tests and every README example)
        run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: publint and Are the Types Wrong
        run: pnpm run lint:package

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          tarball="$RUNNER_TEMP/pack/charchy-send-${{ steps.version.outputs.version }}.tgz"
          test -f "$tarball" || { echo "::error::Expected ${tarball}"; exit 1; }
          tar -tzf "$tarball"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarball
          path: ${{ runner.temp }}/pack/charchy-send-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # the OIDC token npm Trusted Publishing exchanges, and provenance signs with
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: npm can stage with Trusted Publishing (11.15.0 or later)
        run: |
          npm --version
          node -e "const [a,b]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&b>=15)?0:1)" "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is too old for staged publishing (needs 11.15.0)."; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball
          path: ${{ runner.temp }}/pack

      - name: Stage on npm
        env:
          TARBALL: ${{ runner.temp }}/pack/charchy-send-${{ needs.build.outputs.version }}.tgz
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          npm stage publish "$TARBALL" --provenance --access public
          {
            echo "### @charchy/send@${VERSION} is staged, not published"
            echo
            echo "Approve it with 2FA: npmjs.com → @charchy/send → **Staged Packages** → **Approve**, or \`npm stage list @charchy/send\` then \`npm stage approve <id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
